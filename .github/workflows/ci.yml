# Builds the app and runs the tests on Windows, for every push to main and
# every pull request. (Linux builds and releases are aster-linux'.)
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  windows:
    name: Windows
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      # libmpv (about 120 MB) is fetched by the build; keep it between runs,
      # keyed on the script that pins its version and hash.
      - uses: actions/cache@v4
        with:
          path: native
          key: libmpv-${{ hashFiles('tools/fetch-libmpv.ps1') }}
      - name: Build
        run: dotnet build Aster.slnx -c Release
      # ffmpeg isn't on the runner, so the libmpv tests that need a clip skip themselves.
      - name: Test
        run: dotnet test Aster.slnx -c Release --no-build

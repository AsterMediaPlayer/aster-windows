# Builds the downloads for Windows: an installer and a portable zip, both
# self-contained (no .NET needed). Linux builds and releases are
# aster-linux'. Pushing a tag like v0.10.0-beta publishes them as a GitHub
# release (a pre-release when the version has a suffix); running it by hand
# only builds them, to try.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: Version to stamp on a trial build
        default: 0.0.0-dev

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  version:
    name: Version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    permissions:
      contents: write
    steps:
      - id: version
        env:
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          INPUT: ${{ inputs.version }}
        run: |
          version="${TAG#v}"
          [ -n "$version" ] || version="$INPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      # On a tag: the release, as a draft, for the build to put its files on as it finishes
      # (straight there, not through Actions' artifact storage, whose quota a release can hit).
      - name: Draft the release
        if: github.ref_type == 'tag'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          case "$VERSION" in *-*) prerelease="--prerelease" ;; esac
          cat > notes.md <<'NOTES'
          **Windows 10 (1809) or later:** `…-windows-x64-setup.exe` installs Aster for you (no administrator needed); the `.zip` runs from any folder. The app isn't signed yet, so Windows SmartScreen may warn the first time: choose **More info → Run anyway**.

          Aster for Linux has its own releases, at [aster-linux](https://github.com/AsterMediaPlayer/aster-linux/releases).
          NOTES
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft --verify-tag \
            --title "Aster $VERSION" --notes-file notes.md --generate-notes $prerelease

  windows:
    name: Windows
    needs: version
    permissions:
      contents: write
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - uses: actions/cache@v4
        with:
          path: native
          key: libmpv-${{ hashFiles('tools/fetch-libmpv.ps1') }}
      - name: Publish
        # DebugType=none covers our own projects; packages' native debug files (SkiaSharp's, some 100 MB) go too.
        run: |
          dotnet publish src/Aster.Desktop -c Release -r win-x64 --self-contained -p:Version=$env:VERSION -p:DebugType=none -o publish/win-x64
          Remove-Item publish/win-x64/*.pdb -ErrorAction SilentlyContinue
      - name: Zip
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path publish/win-x64/* -DestinationPath "dist/Aster-$env:VERSION-windows-x64.zip"
      - name: Installer
        run: |
          choco install innosetup --no-progress -y
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /Q "/DAppVersion=$env:VERSION" "/DSourceDir=$PWD\publish\win-x64" "/DOutputDir=$PWD\dist" installer\aster.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Onto the release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$env:GITHUB_REF_NAME" (Get-ChildItem dist).FullName --repo "$env:GITHUB_REPOSITORY" --clobber

  release:
    name: Release
    if: github.ref_type == 'tag'
    needs: [version, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Publish the release
        run: gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false
